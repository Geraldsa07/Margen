<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f9d55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Margen">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mi Margen</title>
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#14201a;--mut:#6a7a70;--accent:#1f9d55;--on:#fff;--line:#e2e8e3;--bad:#d4483b;--warn:#c27a10;--soft:#eaf3ec}
@media(prefers-color-scheme:dark){:root{--bg:#0c130f;--card:#151f19;--ink:#e9f1eb;--mut:#8ea194;--accent:#3ddc84;--on:#06240f;--line:#233029;--bad:#ff6b5e;--warn:#f0b04a;--soft:#1b2a21}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(104px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:0 0 14px;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{padding:20px 18px}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.small{font-size:13px}.bad{color:var(--bad)}.good{color:var(--accent)}.warn{color:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cols div{background:var(--soft);border-radius:14px;padding:10px 12px}
.cols b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft);flex:none}
.grow{flex:1;min-width:0}
.grow b,.grow span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:6px}
.chart{width:100%;height:110px;display:block;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
nav button.t{background:none;border:0;color:var(--mut);font:600 11px/1 inherit;font-family:inherit;display:grid;gap:4px;justify-items:center;padding:6px 0}
nav button.t span{font-size:21px;line-height:1}
nav button.t.on{color:var(--accent)}
.fab{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on);font-size:32px;line-height:1;justify-self:center;margin-top:-26px;box-shadow:0 6px 18px rgba(31,157,85,.4)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:600 16px inherit;font-family:inherit;background:var(--accent);color:var(--on);margin-top:12px}
.btn.sec{background:var(--soft);color:var(--ink)}.btn.del{background:none;color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:19px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px;font-weight:600}
input[type=text],input[type=date],select,textarea{width:100%;font:16px inherit;font-family:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);appearance:none;-webkit-appearance:none}
textarea{min-height:90px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 12px;font:500 14px inherit;font-family:inherit}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.amtin{font-size:34px!important;font-weight:700;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
ol{padding-left:20px;margin:8px 0}ol li{margin-bottom:6px}
.empty{text-align:center;padding:18px 8px}
.empty .ico{margin:0 auto 10px;width:56px;height:56px;font-size:28px}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in">
  <button class="t" data-a="tab" data-t="home"><span>🏠</span>Resumen</button>
  <button class="t" data-a="tab" data-t="exp"><span>🕘</span>Historial</button>
  <button class="fab" data-a="addExp" aria-label="Agregar gasto">+</button>
  <button class="t" data-a="tab" data-t="acc"><span>🏦</span>Cuentas</button>
  <button class="t" data-a="tab" data-t="set"><span>⚙️</span>Ajustes</button>
</div></nav>
<div id="ov" class="ov" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
'use strict';
const KEY='mi-margen-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const round2=n=>Math.round(n*100)/100;
const clone=o=>JSON.parse(JSON.stringify(o));

const TYPES={
  efectivo:{n:'Efectivo',i:'💵',debt:0},
  banco:{n:'Cuenta bancaria',i:'🏦',debt:0},
  ahorro:{n:'Ahorros',i:'🐖',debt:0},
  inversion:{n:'Inversión',i:'📈',debt:0},
  tarjeta:{n:'Tarjeta de crédito',i:'💳',debt:1},
  prestamo:{n:'Préstamo / deuda',i:'🧾',debt:1}
};
const CATS={
  comida:{n:'Comida y bebidas',i:'🍽️',c:'#e8833a'},
  super:{n:'Supermercado',i:'🛒',c:'#e0b43a'},
  transporte:{n:'Transporte',i:'🚗',c:'#3a8fe0'},
  compras:{n:'Compras',i:'🛍️',c:'#c75aa8'},
  servicios:{n:'Servicios',i:'💡',c:'#7a5ce0'},
  salud:{n:'Salud',i:'💊',c:'#e05a5a'},
  ocio:{n:'Ocio',i:'🎬',c:'#3ac7b8'},
  viajes:{n:'Viajes',i:'✈️',c:'#5ac75a'},
  hogar:{n:'Hogar',i:'🏠',c:'#a0825a'},
  otros:{n:'Otros',i:'📦',c:'#8a9a90'}
};
const KW={
  super:['auto mercado','automercado','masxmenos','mas x menos','walmart','pricesmart','maxipali','pali','fresh market','megasuper','perimercado','supermercado','super '],
  comida:['restaurante','soda ','mcdonald','burger','pizza','cafe','starbucks','kfc','taco','subway','panaderia','heladeria','pollo','sushi','pops','dominos'],
  transporte:['uber','didi','gasolin','servicentro','taxi','parqueo','peaje','repretel','marchamo'],
  salud:['farmacia','fischel','clinica','hospital','medic','dental','laboratorio'],
  servicios:['kolbi','claro','liberty','netflix','spotify','cnfl','icloud','disney','hbo','recibo','aya ','telecable','tigo'],
  compras:['amazon','shein','temu','zara','mall','epa ','novex','gollo','ropa','tienda'],
  ocio:['cine','cinemark','steam','playstation','xbox','gimnasio','teatro','crossfit'],
  viajes:['hotel','airbnb','booking','airlines','vuelo','avianca','copa air']
};
function guessCat(name){
  const k=norm(name);if(!k)return null;
  if(S.merchants[k])return S.merchants[k].cat;
  for(const c in KW)for(const w of KW[c])if((' '+k+' ').includes(w.trim().length<5?' '+w.trim()+' ':w.trim()))return c;
  return null;
}

/* ---------- datos ---------- */
const def=()=>({v:1,accounts:[],expenses:[],transfers:[],adjust:[],cardMap:{},mailSeen:{},mailQ:[],mailCards:{},snapshots:[],merchants:{},settings:{rate:500,cur:'CRC',show:'CRC',lastAcc:'',mainAcc:'',lastBackup:null,mailUrl:'',mailKey:'',mailAuto:false,mailSince:'',mailLast:0}});
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=def();return Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{})})}}catch(e){}
  return def();
}
let S=load();
function save(){
  snap();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador')}
}
const rate=()=>+S.settings.rate>0?+S.settings.rate:500;
const convert=(v,from,to)=>from===to?v:(to==='CRC'?v*rate():v/rate());
const toCRC=(v,c)=>convert(v,c,'CRC');
function fmt(n,c){
  c=c||'CRC';const neg=n<0,v=Math.abs(n),usd=c==='USD';
  return (neg?'−':'')+(usd?'$':'₡')+v.toLocaleString('es-CR',{minimumFractionDigits:usd?2:0,maximumFractionDigits:usd?2:0});
}
function parseAmount(s){
  if(typeof s==='number')return s;
  s=String(s||'').trim();if(!s)return NaN;
  const neg=/^[-−(]/.test(s);
  s=s.replace(/[^\d.,]/g,'');if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');let dec=null;
  if(lc>-1&&ld>-1)dec=lc>ld?',':'.';
  else if(lc>-1||ld>-1){
    const sep=lc>-1?',':'.',p=s.split(sep);
    if(p.length>2||p[1].length===3)dec=null;else dec=sep;
  }
  let t;
  if(dec){const th=dec===','?'.':',';t=s.split(th).join('').replace(dec,'.')}else t=s.replace(/[.,]/g,'');
  const n=parseFloat(t);return isNaN(n)?NaN:(neg?-n:n);
}
function totals(){
  let a=0,d=0;
  for(const x of S.accounts){const v=toCRC(x.balance,x.cur);if(TYPES[x.type].debt)d+=v;else a+=v}
  return{a,d,n:a-d};
}
function snap(){
  if(!S.accounts.length)return;
  const t=totals(),d=today(),l=S.snapshots,last=l[l.length-1];
  if(last&&last.d===d)last.n=Math.round(t.n);else l.push({d,n:Math.round(t.n)});
  if(l.length>800)l.shift();
}
function applyExp(e,sign){
  const a=S.accounts.find(q=>q.id===e.accId);if(!a)return;
  const v=convert(e.amount,e.cur,a.cur);
  a.balance=round2(a.balance+(TYPES[a.type].debt?1:-1)*sign*v);
}
/* ---------- recargas entre cuentas ---------- */
function trLabel(t){
  const f=S.accounts.find(a=>a.id===t.from),o=S.accounts.find(a=>a.id===t.to);
  return (f?f.name:'Pago')+' → '+(o?o.name:'?');
}
function applyTransfer(t,sign){
  const from=S.accounts.find(a=>a.id===t.from),to=S.accounts.find(a=>a.id===t.to);
  if(from)from.balance=round2(from.balance-sign*convert(t.amount,t.cur,from.cur));
  if(to)to.balance=round2(to.balance+(TYPES[to.type].debt?-1:1)*sign*convert(t.amount,t.cur,to.cur));
}
function transferSheet(){
  if(S.accounts.length<2){toast('Necesitas al menos 2 cuentas');return}
  const asset=S.accounts.filter(a=>!TYPES[a.type].debt);
  if(!asset.length){toast('Necesitas una cuenta de la que salga el dinero');return}
  const from=asset.find(a=>a.id===S.settings.mainAcc)||asset[0];
  const to=S.accounts.find(a=>a.id!==from.id&&!TYPES[a.type].debt)||S.accounts.find(a=>a.id!==from.id);
  D={};
  let h='<h3>Recargar o transferir</h3>';
  if(!S.settings.mainAcc)h+='<p class="small mut" style="margin-top:-4px">Tip: marca tu cuenta principal (BP) en su ficha, y aquí saldrá elegida sola.</p>';
  h+=field('Desde (sale el dinero)','<select id="t-from">'+asset.map(a=>'<option value="'+a.id+'"'+(a.id===from.id?' selected':'')+'>'+esc(TYPES[a.type].i+' '+a.name)+'</option>').join('')+'</select>');
  h+=field('Hacia (recibe el dinero)','<select id="t-to">'+S.accounts.map(a=>'<option value="'+a.id+'"'+(a.id===to.id?' selected':'')+'>'+esc(TYPES[a.type].i+' '+a.name)+'</option>').join('')+'</select>');
  h+=field('<span id="t-lab"></span>','<input type="text" id="t-amt" class="amtin" inputmode="decimal" placeholder="0">');
  h+='<p class="small mut" id="t-note" style="margin-top:-6px"></p>';
  h+=field('Fecha','<input type="date" id="t-date" value="'+today()+'">');
  h+='<button class="btn" data-a="saveTransfer">Guardar</button><button class="btn sec" data-a="closeSheet">Cancelar</button>';
  openSheet(h);syncTransfer();
  setTimeout(()=>{const i=$('#t-amt');i&&i.focus()},50);
}
function syncTransfer(){
  const to=S.accounts.find(a=>a.id===$('#t-to').value);if(!to)return;
  $('#t-lab').textContent='Monto en '+(to.cur==='USD'?'dólares ($)':'colones (₡)');
  $('#t-note').textContent=TYPES[to.type].debt?'Es una deuda: el pago baja lo que debes.':'';
}
function saveTransfer(){
  const from=S.accounts.find(a=>a.id===$('#t-from').value),to=S.accounts.find(a=>a.id===$('#t-to').value);
  const amt=parseAmount($('#t-amt').value);
  if(!from||!to||from.id===to.id){toast('Elige dos cuentas distintas');return}
  if(!(amt>0)){toast('Escribe un monto mayor a 0');return}
  const t={id:uid(),date:$('#t-date').value||today(),from:from.id,to:to.id,amount:round2(amt),cur:to.cur};
  applyTransfer(t,1);S.transfers.push(t);
  save();closeSheet();render();toast('Listo: '+fmt(t.amount,t.cur)+' de '+from.name+' a '+to.name);
}
function nextDue(a){
  if(!TYPES[a.type].debt||!a.dia||!(a.cuota>0)||a.balance<=0)return null;
  const now=new Date(),mk=today().slice(0,7);
  let y=now.getFullYear(),m=now.getMonth();
  if(a.paidMonth===mk){m++;if(m>11){m=0;y++}}
  const dim=new Date(y,m+1,0).getDate(),dt=new Date(y,m,Math.min(a.dia,dim));
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return{dt,days:Math.round((dt-t0)/864e5)};
}
const dueTxt=d=>d<0?'vencido hace '+(-d)+(d===-1?' día':' días'):d===0?'vence hoy':d===1?'vence mañana':'en '+d+' días';
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('es-CR',{day:'numeric',month:'short'});
function dayLabel(d){
  const t=today();if(d===t)return'Hoy';
  const y=new Date();y.setDate(y.getDate()-1);
  if(d===y.getFullYear()+'-'+pad(y.getMonth()+1)+'-'+pad(y.getDate()))return'Ayer';
  return new Date(d+'T00:00:00').toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'short'});
}
const monthName=mk=>{const[y,m]=mk.split('-');return new Date(+y,+m-1,1).toLocaleDateString('es-CR',{month:'long',year:'numeric'})};
const monthExp=mk=>S.expenses.filter(e=>e.date.startsWith(mk));
const monthTotal=mk=>monthExp(mk).reduce((s,e)=>s+toCRC(e.amount,e.cur),0);
const showCur=()=>S.settings.show==='USD'?'USD':'CRC';
const money=crc=>fmt(convert(crc,'CRC',showCur()),showCur());

/* ---------- UI ---------- */
let tab='home',expMonth=today().slice(0,7),D=null;

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
function openSheet(h){$('#sheet').innerHTML=h;$('#ov').hidden=false}
function closeSheet(){$('#ov').hidden=true;$('#sheet').innerHTML='';D=null}

function render(){
  document.querySelectorAll('nav button.t').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const v={home:vHome,exp:vExp,acc:vAcc,set:vSet}[tab]();
  $('#app').innerHTML=v;
}

function chartSvg(){
  const l=S.snapshots.slice(-60);
  if(l.length<2)return'<p class="mut small" style="margin:0">El gráfico aparece cuando haya datos de 2 días distintos. Abre la app cada día o registra gastos y se va armando solo.</p>';
  const W=320,H=110,p=6,vs=l.map(x=>x.n);let mn=Math.min(...vs),mx=Math.max(...vs);
  if(mn===mx){mn-=1;mx+=1}
  const pts=l.map((x,i)=>[p+i*(W-2*p)/(l.length-1),H-p-(x.n-mn)/(mx-mn)*(H-2*p)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+H+' L'+pts[0][0].toFixed(1)+' '+H+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="chart"><path d="'+area+'" fill="var(--accent)" opacity=".13"/><path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="row small mut"><span>'+fmtDate(l[0].d)+' · '+money(l[0].n)+'</span><span>'+fmtDate(l[l.length-1].d)+'</span></div>';
}

function vHome(){
  if(!S.accounts.length){
    return '<h1>Mi Margen</h1><div class="card empty"><div class="ico">🌱</div><b>Empieza con tus cuentas</b><p class="mut">Agrega tu efectivo, bancos, ahorros, inversiones y deudas. Con eso la app calcula tu patrimonio en un solo número.</p><button class="btn" data-a="newAcc">Agregar primera cuenta</button></div>';
  }
  const t=totals(),now=today();
  let delta='';
  const lim=new Date();lim.setDate(lim.getDate()-30);
  const limS=lim.getFullYear()+'-'+pad(lim.getMonth()+1)+'-'+pad(lim.getDate());
  const base=S.snapshots.find(s=>s.d>=limS);
  if(base&&base.d!==now){
    const d=t.n-base.n;
    delta='<span class="pill '+(d>=0?'good':'bad')+'">'+(d>=0?'▲ ':'▼ ')+money(Math.abs(d))+' desde '+fmtDate(base.d)+'</span>';
  }
  const mk=now.slice(0,7),list=monthExp(mk),tot=monthTotal(mk);
  const byCat={};list.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+toCRC(e.amount,e.cur)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const dues=S.accounts.map(a=>({a,n:nextDue(a)})).filter(x=>x.n).sort((x,y)=>x.n.days-y.n.days);
  let h='<h1>Mi Margen</h1>';
  if(S.mailQ.length)h+='<div class="card" style="background:var(--soft)"><b>📧 '+S.mailQ.length+(S.mailQ.length===1?' gasto nuevo':' gastos nuevos')+' del correo</b><button class="btn" data-a="mailOpen" style="margin-top:10px">Revisar y agregar</button></div>';
  h+='<div class="card hero"><div class="row"><span class="mut small" style="font-weight:600">PATRIMONIO NETO</span><button class="chip" data-a="toggleShow">'+showCur()+'</button></div>';
  h+='<div class="big '+(t.n<0?'bad':'')+'">'+money(t.n)+'</div>'+delta;
  h+='<div class="cols"><div><span class="mut small">Activos</span><b class="good">'+money(t.a)+'</b></div><div><span class="mut small">Deudas</span><b class="'+(t.d>0?'bad':'')+'">'+money(t.d)+'</b></div></div></div>';
  h+='<div class="card"><h2>Evolución</h2>'+chartSvg()+'</div>';
  if(dues.length){
    h+='<div class="card"><h2>Próximos pagos</h2>';
    dues.slice(0,5).forEach(({a,n})=>{

let hFilter='all',hAcc='';
function histItems(mk){
  const out=[],all=hFilter==='all';
  if(all||hFilter==='exp')S.expenses.forEach(e=>{
    if(!e.date.startsWith(mk)||(hAcc&&e.accId!==hAcc))return;
    const a=S.accounts.find(q=>q.id===e.accId);
    out.push({id:e.id,date:e.date,ico:CATS[e.cat].i,title:e.desc,sub:CATS[e.cat].n+(a?' · '+a.name:' · ⚠️ sin cuenta')+(e.rec?' · 🔁':''),amt:'−'+fmt(e.amount,e.cur),cls:'',act:'editExp'});
  });
  if(all||hFilter==='tr')S.transfers.forEach(t=>{
    if(!t.date.startsWith(mk)||(hAcc&&t.from!==hAcc&&t.to!==hAcc))return;
    const o=S.accounts.find(q=>q.id===t.to),pago=t.kind==='pago'||(o&&TYPES[o.type].debt);
    out.push({id:t.id,date:t.date,ico:pago?'💳':'↔️',title:trLabel(t),sub:pago?'Pago de tarjeta o deuda':'Recarga entre cuentas',amt:fmt(t.amount,t.cur),cls:'mut',act:'delTransfer'});
  });
  if(all||hFilter==='adj')S.adjust.forEach(j=>{
    if(!j.date.startsWith(mk)||(hAcc&&j.acc!==hAcc))return;
    const a=S.accounts.find(q=>q.id===j.acc);
    out.push({id:j.id,date:j.date,ico:'✏️',title:'Ajuste de saldo',sub:a?a.name:'',amt:(j.delta>0?'+':'−')+fmt(Math.abs(j.delta),j.cur),cls:j.delta>0?'good':'bad',act:''});
  });
  return out.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
}

function saveExp(){
  const x=D.x,amt=parseAmount($('#x-amt').value);

function saveAcc(){
  const x=D.x,name=$('#a-name').value.trim();
  if(!name){toast('Ponle un nombre a la cuenta');return}

  const i=S.accounts.findIndex(q=>q.id===x.id);
  if(i>-1){const old=S.accounts[i],dl=round2(x.balance-old.balance);if(dl!==0)S.adjust.push({id:uid(),date:today(),acc:x.id,delta:dl,cur:x.cur});x.paidMonth=old.paidMonth;S.accounts[i]=x}else S.accounts.push(x);

  save();closeSheet();render();toast('Cuenta guardada');

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mi-margen-respaldo-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  S.settings.lastBackup=today();save();render();toast('Respaldo descargado');
}
function restore(txt){
  try{
    const o=JSON.parse(txt);
    if(!o||!Array.isArray(o.accounts)||!Array.isArray(o.expenses))throw 0;
    if(!confirm('Esto reemplaza los datos actuales por los del respaldo. ¿Continuar?'))return;
    const d=def();S=Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{})});
    save();closeSheet();render();toast('Datos restaurados');
  }catch(e){toast('El respaldo no es válido')}
}

/* ---------- gastos desde el correo ---------- */
function mailAcc(it){
  const l=it.last4&&S.mailCards[it.last4];
  if(l&&S.accounts.find(a=>a.id===l))return l;
  const b=String(it.bank||'').toLowerCase();if(!b)return '';
  const a=S.accounts.find(q=>norm(q.name).split(/[^a-z0-9]+/).includes(b));
  return a?a.id:'';
}
function cleanM(s){
  s=String(s||'').replace(/\s+/g,' ').trim().replace(/\s(CR|Costa Rica)$/i,'');
  return s.toLowerCase().replace(/(^|[\s\-\/])([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase());
}
function mailCommit(it,accId){
  const desc=cleanM(it.desc)||'Compra';
  const x={id:uid(),date:it.d||today(),desc,amount:it.amount,cur:it.cur==='USD'?'USD':'CRC',cat:guessCat(desc)||'otros',accId,rec:false,ref:it.ref};
  applyExp(x,1);S.expenses.push(x);S.mailSeen[it.ref]=1;
  if(it.last4&&accId)S.mailCards[it.last4]=accId;
}
function mailFetch(manual){
  const u=S.settings.mailUrl,k=S.settings.mailKey;
  if(!u||!k){if(manual)toast('Falta la dirección o la clave');return Promise.resolve()}
  return new Promise(res=>{
    const cb='mcb'+Date.now();let done=false;
    const s=document.createElement('script');
    const fin=o=>{if(done)return;done=true;clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove();res(o)};
    const tm=setTimeout(()=>fin(null),15000);
    window[cb]=fin;s.onerror=()=>fin(null);
    s.src=u+(u.includes('?')?'&':'?')+'t='+encodeURIComponent(k)+'&dias=14&callback='+cb;
    document.head.appendChild(s);
  }).then(o=>{
    if(!o||!o.ok){if(manual)toast(o&&o.error==='token'?'La clave no coincide':'No pude leer los correos');return}
    const since=S.settings.mailSince||'';
    const items=(o.items||[]).filter(it=>it&&it.ref&&it.amount>0&&(!since||(it.d||'')>=since)&&!S.mailSeen[it.ref]&&!S.mailQ.some(q=>q.ref===it.ref));
    let auto=0;
    items.forEach(it=>{const id=mailAcc(it);if(S.settings.mailAuto&&id){mailCommit(it,id);auto++}else S.mailQ.push(it)});
    S.settings.mailLast=Date.now();save();
    if(!D)render();
    if(auto)toast(auto+(auto===1?' gasto importado':' gastos importados')+' del correo');
    else if(manual)toast(items.length?items.length+' nuevos':'Sin gastos nuevos');
  });
}
function mailSheet(){
  if(!S.mailQ.length){closeSheet();render();return}
  let h='<h3>Gastos del correo</h3>';
  S.mailQ.forEach((it,i)=>{
    const id=it.accId!==undefined?it.accId:mailAcc(it);
    h+='<div style="margin-bottom:14px"><div class="row"><b>'+esc(cleanM(it.desc))+'</b><b>'+fmt(it.amount,it.cur==='USD'?'USD':'CRC')+'</b></div>'+
    '<div class="row small mut"><span>'+fmtDate(it.d)+(it.bank?' · '+esc(it.bank):'')+(it.last4?' ·· '+esc(it.last4):'')+'</span><button class="chip" data-a="mailIgnore" data-i="'+i+'">Ignorar</button></div>'+
    '<select data-mi="'+i+'" style="margin-top:6px">'+accOptions(id,true)+'</select></div>';
  });
  h+='<button class="btn" data-a="mailAddAll">Agregar todos</button><button class="btn sec" data-a="closeSheet">Cerrar</button>';
  openSheet(h);
}
let mailT=0;
function mailAuto(){if(Date.now()-mailT<60000)return;mailT=Date.now();mailFetch(false)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)mailAuto()});

/* ---------- eventos ---------- */
const A={
  tab:t=>{tab=t.dataset.t;render();window.scrollTo(0,0)},
  addExp:()=>expenseSheet(),
  editExp:t=>{const e=S.expenses.find(q=>q.id===t.dataset.id);if(e)expenseSheet(e)},
  newAcc:()=>accountSheet(),
  transfer:()=>transferSheet(),
  hFilter:t=>{hFilter=t.dataset.f;render()},
  mailOpen:()=>mailSheet(),
  mailNow:()=>{mailT=Date.now();mailFetch(true)},
  mailIgnore:t=>{const it=S.mailQ[+t.dataset.i];if(!it)return;S.mailSeen[it.ref]=1;S.mailQ.splice(+t.dataset.i,1);save();render();mailSheet()},
  mailAddAll:()=>{
    let n=0,skip=0;
    S.mailQ=S.mailQ.filter(it=>{const id=it.accId!==undefined?it.accId:mailAcc(it);if(!id){skip++;return true}mailCommit(it,id);n++;return false});
    save();render();
    if(skip){mailSheet();toast(n+' agregados, '+skip+' sin cuenta')}else{closeSheet();toast(n+(n===1?' gasto agregado':' gastos agregados'))}
  },
  saveTransfer,
  delTransfer:t=>{
    const x=S.transfers.find(q=>q.id===t.dataset.id);
    if(!x||!confirm('¿Deshacer esta transferencia? El dinero vuelve a la cuenta de origen.'))return;
    applyTransfer(x,-1);S.transfers=S.transfers.filter(q=>q.id!==x.id);save();render();toast('Transferencia deshecha');
  },
  editAcc:t=>{const a=S.accounts.find(q=>q.id===t.dataset.id);if(a)accountSheet(a)},
  payDebt:t=>paySheet(t.dataset.id),
  toggleShow:()=>{S.settings.show=showCur()==='CRC'?'USD':'CRC';save();render()},
  mPrev:()=>{const[y,m]=expMonth.split('-').map(Number);const d=new Date(y,m-2,1);expMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render()},
  mNext:()=>{const[y,m]=expMonth.split('-').map(Number);const d=new Date(y,m,1);expMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render()},
  setCur:t=>{D.x.cur=t.dataset.c;document.querySelectorAll('.cb').forEach(b=>b.classList.toggle('on',b.dataset.c===t.dataset.c))},
  setCat:t=>{D.catManual=true;setCat(t.dataset.c)},
  freq:t=>{
    const m=S.merchants[t.dataset.k];if(!m)return;
    $('#x-desc').value=m.name;$('#x-amt').value=m.amt;D.x.cur=m.cur;
    document.querySelectorAll('.cb').forEach(b=>b.classList.toggle('on',b.dataset.c===m.cur));
    if(S.accounts.find(a=>a.id===m.acc))$('#x-acc').value=m.acc;
    D.catManual=true;setCat(m.cat);
  },
  saveExp,saveAcc,savePay,closeSheet,
  delExp:()=>{
    if(!D.orig||!confirm('¿Eliminar este gasto? Se devuelve el monto a la cuenta.'))return;
    applyExp(D.orig,-1);S.expenses=S.expenses.filter(q=>q.id!==D.orig.id);save();closeSheet();render();toast('Gasto eliminado');
  },
  delAcc:()=>{
    if(!confirm('¿Eliminar esta cuenta? Los gastos ligados se quedan sin cuenta.'))return;
    S.accounts=S.accounts.filter(q=>q.id!==D.x.id);
    S.transfers=S.transfers.filter(t=>t.from!==D.x.id&&t.to!==D.x.id);
    S.adjust=S.adjust.filter(j=>j.acc!==D.x.id);
    if(S.settings.mainAcc===D.x.id)S.settings.mainAcc='';
    S.expenses.forEach(e=>{if(e.accId===D.x.id)e.accId=''});
    save();closeSheet();render();toast('Cuenta eliminada');
  },
  copyUrl:()=>{
    const u=baseUrl()+'?importe=IMPORTE&comercio=COMERCIO&cuenta=TARJETA';
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Dirección copiada')).catch(()=>{
      const r=document.createRange();r.selectNodeContents($('#u'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selecciónala y cópiala');
    });
  },
  export:exportJson,
  copyBackup:()=>{
    (navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(S)):Promise.reject()).then(()=>{S.settings.lastBackup=today();save();render();toast('Respaldo copiado')}).catch(()=>toast('No se pudo copiar'));
  },
  importFile:()=>$('#file').click(),
  importPaste:()=>openSheet('<h3>Restaurar respaldo</h3><div class="field"><label>Pega aquí el texto del respaldo</label><textarea id="paste"></textarea></div><button class="btn" data-a="doPaste">Restaurar</button><button class="btn sec" data-a="closeSheet">Cancelar</button>'),
  doPaste:()=>restore($('#paste').value),
  wipe:()=>{if(confirm('¿Borrar TODOS los datos de Mi Margen? No se puede deshacer.')){S=def();try{localStorage.removeItem(KEY)}catch(e){}render();toast('Datos borrados')}}
};
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closeSheet();return}
  const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t);
});
document.addEventListener('input',e=>{
  if(e.target.id==='x-desc'&&D&&!D.catManual){const g=guessCat(e.target.value);if(g)setCat(g)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='a-type')syncAccType();
  if(e.target.id==='t-to')syncTransfer();
  if(e.target.id==='h-acc'){hAcc=e.target.value;render()}
  const k=e.target.dataset&&e.target.dataset.s;
  if(k==='rate'){const v=parseAmount(e.target.value);if(v>0){S.settings.rate=v;save();toast('Tipo de cambio guardado')}else{e.target.value=S.settings.rate}}
  if(k==='cur'){S.settings.cur=e.target.value;save()}
  if(k==='mailUrl'||k==='mailKey'){S.settings[k]=e.target.value.trim();if(S.settings.mailUrl&&S.settings.mailKey&&!S.settings.mailSince)S.settings.mailSince=today();save();render();toast('Guardado')}
  if(k==='mailSince'){S.settings.mailSince=e.target.value;save()}
  if(k==='mailAuto'){S.settings.mailAuto=e.target.checked;save()}
  if(e.target.dataset&&e.target.dataset.mi!==undefined){const it=S.mailQ[+e.target.dataset.mi];if(it){it.accId=e.target.value;save()}}
  if(e.target.id==='file'&&e.target.files[0]){
    const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(e.target.files[0]);e.target.value='';
  }
});

/* ---------- entrada desde el atajo ---------- */
function fromUrl(){
  const p=new URLSearchParams(location.search);
  if(!p.has('importe')&&!p.has('comercio'))return;
  const amt=Math.abs(parseAmount(p.get('importe'))),desc=(p.get('comercio')||'').trim();
  const mon=(p.get('moneda')||'').toUpperCase(),cu=p.get('cuenta')||'';
  const pre={raw:{importe:p.get('importe')||'',comercio:p.get('comercio')||'',cuenta:p.get('cuenta')||''}};
  if(amt>0)pre.amount=amt;
  if(desc)pre.desc=desc;
  const rawAmt=p.get('importe')||'';
  if(mon==='USD'||mon==='$'||/\$|usd/i.test(rawAmt))pre.cur='USD';else if(mon==='CRC'||mon==='₡'||/₡|crc/i.test(rawAmt))pre.cur='CRC';
  const g=guessCat(desc);if(g){pre.cat=g;pre.catSet=true}
  const k=norm(desc),m=S.merchants[k];
  if(m){if(!pre.cat){pre.cat=m.cat;pre.catSet=true}if(!pre.cur&&pre.amount==null)pre.cur=m.cur}
  const q=norm(cu);
  if(q){
    pre.card=cu;
    let acc=S.accounts.find(a=>a.id===S.cardMap[q]);
    if(!acc)acc=S.accounts.find(a=>a.alias&&norm(a.alias)&&(norm(a.alias)===q||q.includes(norm(a.alias))));
    if(!acc){
      acc=S.accounts.filter(a=>{const n=norm(a.name);return n&&(n===q||q.includes(n)||n.includes(q))}).sort((a,b)=>b.name.length-a.name.length)[0];
    }
    pre.accId=acc?acc.id:'';
  }else if(m&&S.accounts.find(a=>a.id===m.acc))pre.accId=m.acc;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  expenseSheet(null,pre);
}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
snap();render();fromUrl();if(!new URLSearchParams(location.search).has('importe'))setTimeout(mailAuto,300);
